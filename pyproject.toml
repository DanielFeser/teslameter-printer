[project]
name = "teslameter-printer"
version = "1.0.0"
description = "Magnetic field mapping with a 3D printer and a 3MTS teslameter, with a collision test run and live heatmaps."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.3.2",
    "printrun>=2.2.0",
    "pyqt6>=6.9.1",
    "pyqtgraph>=0.13.7",
    "pytango>=10.0.3",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.0",
]
